<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{ --rose:#d94f7c; --ink:#1f1d1d; --cream:#faf5f1; }
    *{ box-sizing:border-box }
    html,body{ margin:0 }
    body{
      min-height:100vh;
      font-family:'Plus Jakarta Sans',system-ui,sans-serif;
      color:var(--ink);
      background-color:var(--cream);
      background-image: radial-gradient(rgba(217,79,124,0.05) 1px, transparent 1px);
      background-size:22px 22px;
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .header{ text-align:center; }
    .kicker{ font-size:13px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--rose); margin-bottom:10px; }
    h1{ margin:0; font-weight:800; letter-spacing:-.01em; font-size:clamp(28px,4.5vw,46px); line-height:1.05; }
    .swatches{ display:flex; gap:12px; justify-content:center; margin-top:18px; }
    .swatches span{ width:46px; height:14px; border-radius:99px; display:block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
  </style>
</head>
<body>
  <div class="header">
    <div class="kicker">Cotton Candy Atelier</div>
    <h1>Choose your flavor</h1>
    <div class="swatches">
      <span style="background:#6b4226"></span>
      <span style="background:#f9d0de"></span>
      <span style="background:#c8dff5"></span>
    </div>
  </div>
</body>
</html>
