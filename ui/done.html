<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://lehre.bpm.in.tum.de/~go93xak/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #fff; }
    .done { text-align: center; padding: 24px; }
    .check { width: 96px; height: 96px; border-radius: 50%; background: #4caf50; margin: 0 auto;
             display: flex; align-items: center; justify-content: center; }
    .done h2 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 800; margin: 28px 0 8px; }
    .done p { color: var(--muted); font-size: 17px; margin: 0; }
  </style>
</head>
<body>
  <div class="done">
    <div class="check">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3">
        <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h2>Your cotton candy is ready!</h2>
    <p>Enjoy</p>
  </div>
</body>
</html>
